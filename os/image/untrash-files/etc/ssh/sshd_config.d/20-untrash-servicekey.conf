# UntrashOS service access: root by key only, and only with the keys that
# untrash-servicekey.service copied from UNTRASH/ssh/authorized_keys of the
# UntrashOS stick plugged in at boot (RAM only: gone at the next start
# without the stick).  Passwords stay off (10-untrash.conf).
Match User root
	AuthorizedKeysFile .ssh/authorized_keys /run/untrash/servicekey/authorized_keys
