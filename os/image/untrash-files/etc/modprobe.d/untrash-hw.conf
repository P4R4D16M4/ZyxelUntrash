# UntrashOS on the NAS542: modules that udev would auto-load from the device
# tree but that are unsafe or unproven.  `install ... /bin/false` also stops
# loads pulled in as dependencies.
#   spi-nor / spi-dw*: loading spi-nor hangs the NAS completely (V580)
#   rest:              never loaded in the hardware-proven RAM systems (V583-V590c)
# PCIe/ASM1061 is intentionally *not* blocked: V607 proved the corrected
# SerDes CMU sequence and the ordered post-PFE load in untrash-pcie.service.
install spi_nor /bin/false
install spi_dw /bin/false
install spi_dw_mmio /bin/false
install dwc2 /bin/false
install dwc3_haps /bin/false
install at24 /bin/false
install lm75 /bin/false
install rtc_s35390a /bin/false
install gpio_keys /bin/false
