# UntrashOS: the media database lives on /state and survives reboots; inotify
# follows changes while running.  Debian's "-r" re-walked the whole library on
# every boot (16k videos: minutes of full CPU).  A full rebuild is the Desk
# button Medienserver -> Neu einlesen.
#
# Start only once the stock volumes are mounted, and never with a config
# without media_dir: minidlna drops its database whenever the media_dir set
# differs from the one it was built with.  Until r21 it started before
# untrash-zyxel mounted the volumes (config without media_dir -> "Creating new
# database"), then again after the mount ("New media_dir detected;
# rebuilding") = a full scan on every boot (2026-10-18).
[Unit]
After=untrash-zyxel.service

[Service]
Environment=DAEMON_OPTS=
ExecCondition=/bin/grep -q "^media_dir=" /etc/minidlna.conf
