# UntrashOS root filesystem: Debian 13 armhf.
# Built as a directory tree; os/image/mkslot-erofs.sh turns it into a signed
# erofs + dm-verity slot.  Kernel and modules come from our 6.6 build, not
# from Debian.
[Distribution]
Distribution=debian
Release=trixie
Architecture=arm
Repositories=main

[Output]
Format=directory
ImageId=untrash-rootfs
OutputDirectory=../../build/image

[Build]
ToolsTree=
WorkspaceDirectory=../../build/image-work

[Content]
Bootable=no
WithDocs=no
Locale=C.UTF-8
Timezone=Europe/Berlin
Hostname=untrash
Packages=
        systemd
        systemd-sysv
        udev
        dbus
        kmod
        iproute2
        openssh-server
        ca-certificates
        procps
        less
        nano
        mdadm
        btrfs-progs
        e2fsprogs
        smartmontools
        chrony
        systemd-resolved
        acl
        python3
        lvm2
        samba
        mtd-utils
        quota
        parted
        sqlite3
        gdisk
        avahi-daemon
        vsftpd
        nfs-kernel-server
        minidlna
        hd-idle
        openssl
        libpam-modules
        psmisc
        inadyn
        apcupsd
        apache2-bin
        libapache2-mod-authnz-external
        media-types
        cups-daemon
        cups-client
        rclone
        aria2
        rsync
        miniupnpc
        sudo
        ffmpeg
        dnsmasq-base
