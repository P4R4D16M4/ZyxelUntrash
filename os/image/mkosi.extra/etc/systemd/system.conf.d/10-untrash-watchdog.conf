# The loader hands over through kexec with the LS1024A watchdog armed
# (hardware maximum ~17 s).  While running, untrash-wdt.service feeds it:
# systemd does not feed during a daemon-reload, and under load a reload can
# take longer than 15 s.  For reboot/power-off
# systemd-shutdown takes over again.
[Manager]
RuntimeWatchdogSec=off
RebootWatchdogSec=15s
