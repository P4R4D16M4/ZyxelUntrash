# NAS542 front keys (gpio-keys-polled): power = KEY_POWER -> clean poweroff.
# reset = KEY_RESTART and copy = KEY_PROG1 must never reboot/poweroff the NAS
# by accident (stock: reset = config reset, copy = USB copy).
[Login]
HandlePowerKey=poweroff
HandlePowerKeyLongPress=poweroff
HandleRebootKey=ignore
HandleRebootKeyLongPress=ignore
PowerKeyIgnoreInhibited=no
